name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies and Build project
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build
            echo "BUILD_DIR=./dist" >> $GITHUB_ENV
          elif [ -f "nodedcode.studio/package.json" ]; then
            cd nodedcode.studio
            npm install
            npm run build
            echo "BUILD_DIR=./nodedcode.studio/dist" >> $GITHUB_ENV
          elif [ -f "Website/package.json" ]; then
            cd Website
            npm install
            npm run build
            echo "BUILD_DIR=./Website/dist" >> $GITHUB_ENV
          else
            echo "Error: package.json not found in repository root or known subdirectories." && exit 1
          fi

      - name: Upload production build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
